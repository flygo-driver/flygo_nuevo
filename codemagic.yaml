# RAI Driver — build iOS únicamente (no toca Android).
# Certificados y perfiles: configurar en Codemagic → Team settings → iOS code signing
# o con la integración Apple Developer Portal.
#
# Rama sugerida: feature/ios-codemagic

workflows:
  rai-driver-ios:
    name: RAI Driver iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.flygo.rd2

    # Descomenta si quieres auto-build al push en esta rama:
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: feature/ios-codemagic
    #       include: true

    scripts:
      - name: Instalar dependencias Flutter
        script: flutter pub get

      # Requiere perfiles de aprovisionamiento cargados en Codemagic
      - name: Configurar firma en el proyecto Xcode
        script: xcode-project use-profiles

      - name: Compilar IPA (solo iOS)
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - ventasopenask@gmail.com
        notify:
          success: true
          failure: true
